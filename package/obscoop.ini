[obscoop]
; Obscure II co-op settings. Leave this file next to Obscure2.exe.
; The start_*.bat files set ROLE / NET / UDP / PEER / LOCAL_PAD themselves and win over this file, so
; most players never edit it. The lines below matter when you start the game from Steam's own Play
; button instead of a .bat file. One key per line, name = value, ';' starts a comment.
;
; ROLE=host            host or guest. Leave it out and the game runs without co-op.
; NET=udp              udp = through the relay on this PC, steam = direct link to the other player
; UDP=27962            the relay port: 27962 on the guest, 27961 on the host
; PEER=127.0.0.1       the relay always runs on this PC
; HOST_STEAMID=        direct link: the host's 17-digit Steam ID (the host's steam_id.txt)
; HOST_NAME=           direct link: or the host's Steam friend name

; Your own controller (0 = the first one on this PC).
LOCAL_PAD=0
; 1 hides real controllers from the game (for a player whose only pad is the virtual one).
HIDE_REAL_PADS=0
; 1 = window, 0 = fullscreen. A window is recommended: a fullscreen game that loses focus gets
; minimised, and a minimised game stops sending.
WINDOWED=1
; own = your camera follows your own character; shared = the guest follows the host's player 1.
CAMERA=own
